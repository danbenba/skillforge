services:
  skillforge:
    build: .
    container_name: skillforge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SKILLFORGE_ENV: prod
      SKILLFORGE_HOST: 0.0.0.0
    ports:
      - '${SKILLFORGE_PORT:-8765}:8765'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8765/health']
      interval: 30s
      timeout: 5s
      retries: 3
